name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether a pull request needs the macOS jobs, which wait for GitHub's scarcer macOS runners (#245). One that
  # changes only files no macOS job reads (the docs, the changelog, the version) skips them, and a skipped job reports
  # its check as passed, so their required checks do not hold it up. Anything else, any doubt, and every push to main
  # runs them: they run unless this job says "false", so if it fails they run too.
  changes:
    name: Which jobs the change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.files.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2 # the merge commit CI tests, and main's commit it was made on
          persist-credentials: false
      - id: files
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ $EVENT != pull_request ]]; then
            echo "A $EVENT: running every job."
            echo macos=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # What the commit being tested changes from main as it is now, both names of a moved file.
          changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          macos=false
          [[ -n $changed ]] || { echo "No file changed: running every job."; macos=true; }
          while IFS= read -r file; do
            case $file in
              "") ;;
              # Read by no macOS job. A file one of them starts reading comes off this list.
              docs/* | README.md | CONTRIBUTING.md | CHANGELOG.md | SECURITY.md | CLAUDE.md) ;;
              # Changelog entries: Transcript page (tests) checks them on Linux.
              changelog.d/*) ;;
              # Checked by the Linux job Scripts (tests), or by nothing else in CI (rerun-if-no-runner, auto-merge).
              scripts/issue | scripts/issue-hook | scripts/test-issue | scripts/test-issue-hook) ;;
              scripts/rerun-if-no-runner | scripts/auto-merge) ;;
              # Copied into the app's Info.plist by app/build.sh, which drops white space: checked here for what
              # could break that.
              app/VERSION)
                version=$(tr -d '[:space:]' < app/VERSION)
                [[ $version =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "::error::app/VERSION is not a version: $version"; exit 1; } ;;
              *) echo "Needs the macOS jobs: $file"; macos=true ;;
            esac
          done <<<"$changed"
          [[ $macos == true ]] || echo "Only files no macOS job reads: skipping the engine's tests and the app's build."
          echo "macos=$macos" >> "$GITHUB_OUTPUT"

  engine:
    name: Engine (type-check and tests)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' }}
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:macos

  engine-linux:
    name: Engine (Linux tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - run: npm run test:linux

  transcript:
    name: Transcript page (tests)
    # Plain Node with nothing macOS-specific, so it runs on Linux and leaves the scarcer macOS runners to the other jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Markdown, escaping, tool summaries, diffs, what a selection copies as and what Return does in an answer. No dependencies to install.
      - run: node --test test/
      - name: Check release-note extraction (no release)
        working-directory: app
        run: node --test test-release-notes.mjs

  scripts:
    name: Scripts (tests)
    # scripts/issue and its hook need only bash, git and jq, so they are checked on Linux (#235). Neither touches a
    # GitHub issue: the hook's test has a stand-in gh.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/test-issue
      - run: scripts/test-issue-hook

  app:
    name: App (build)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # What scripts/test-copy refuses, in a stand-in checkout: it launches nothing. Here and not on Linux because both
      # it and its test read and write the bundle's Info.plist with PlistBuddy, which only macOS has (#235).
      - name: Check what scripts/test-copy refuses
        run: scripts/test-test-copy
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Build the app, ComputerKit and the probe
        working-directory: app
        run: swift build
      # Built with optimisation, as the app is released: closing a pane crashed only in an optimised build (#134).
      - name: Check the pane layout (optimised build)
        working-directory: app
        run: swift build -c release --product pi2-layout-check && .build/release/pi2-layout-check
      - name: Build and start the packaged release engine
        run: |
          ./app/build.sh release
          node app/check-release-build.mts "app/build/pi².app" --commit "$(git rev-parse HEAD)" --build-number "$(git rev-list --count HEAD)" --open-app
          node app/test-release-build.mts "app/build/pi².app"
      # What Return does in a message field (#174): the decision, then a real SwiftUI field in an off-screen window.
      - name: Check Return in the message field
        working-directory: app
        run: .build/debug/pi2-compose-check
      # How a window's size follows its content (#400): fixed smallest size, long lines, a stack of requests.
      - name: Check window sizes
        working-directory: app
        run: .build/debug/pi2-window-check
      - name: Check engine login item decisions
        working-directory: app
        run: .build/debug/pi2-login-item-check
      # What a click on a link to a file in a conversation does (#451), in a temporary folder: shows nothing in Finder.
      - name: Check file links
        working-directory: app
        run: .build/debug/pi2-file-link-check
      # How the computer tool reaches SwiftUI controls by accessibility (#367, #453): stand-in views read in-process.
      - name: Check how computer use reaches controls
        working-directory: app
        run: .build/debug/pi2-computer-check
      # The conversation page loaded ahead for the next pane (#441): handed over clean, shows what it is sent, replaced
      # when its process ends, and moved into its pane without leaving the window. Off-screen windows of its own.
      - name: Check the conversation page loaded ahead
        working-directory: app
        run: .build/debug/pi2-transcript-check
