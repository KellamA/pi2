name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (type-check and tests)
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  transcript:
    name: Transcript page (tests)
    runs-on: macos-26
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Markdown, escaping, tool summaries, diffs and what a selection copies as. No dependencies to install.
      - run: node --test test/

  app:
    name: App (build)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the app, ComputerKit and the probe
        working-directory: app
        run: swift build
