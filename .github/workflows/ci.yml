name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its run still going. On main, each push has a run of its own, which a later push
# does not cancel as a whole: the iPhone app's job runs only for a merge that touches the phone, so the next merge's run
# would not build it again (#871). The macOS jobs that run on every push to main cancel their own runs still going on
# main, as before, by a concurrency group each.
concurrency:
  # An owner PR retry must not cancel a newer commit pushed between the controller's last read and its re-run request.
  group: ci-${{ github.event_name == 'pull_request' && (github.run_attempt != '1' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner && github.actor == github.repository_owner && format('retry-{0}', github.run_id) || github.ref) || github.sha }}
  cancel-in-progress: true

jobs:
  # Decides whether a pull request needs the macOS jobs, which wait for GitHub's scarcer macOS runners (#245). One that
  # changes only files no macOS job reads (the docs, the changelog, the version) skips them, and a skipped job reports
  # its check as passed, so their required checks do not hold it up. Anything else, any doubt, and every push to main
  # runs them: they run unless this job says "false", so if it fails they run too. The iPhone app's job is decided the
  # other way round, on a push to main too: it runs only for a change to what the phone is built from, and if this job
  # fails (#871). scripts/ci-changes decides both.
  changes:
    name: Which jobs the change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.files.outputs.macos }}
      # Whether the relay changed, which the protocol test (a macOS job) reads besides what macos covers.
      relay: ${{ steps.files.outputs.relay }}
      # Whether the iPhone app's job runs.
      iphone: ${{ steps.files.outputs.iphone }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request: the merge commit CI tests, and main's commit it was made on. A push: the pushed commit and
          # its first parent, which for a merge is main before it.
          fetch-depth: 2
          persist-credentials: false
      - id: files
        # The completion controller looks for this name in attempt 1 before retrying onto GitHub's runners.
        name: Decide which jobs to run (App and Engine retries are hosted)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        # The decision is in the script, which scripts/test-ci-changes holds to its cases (Scripts (tests)).
        run: scripts/ci-changes "$EVENT" "$BEFORE"

  engine:
    name: Engine (type-check and tests)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' }}
    concurrency:
      group: ci-engine-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
      cancel-in-progress: true
    # The owner's runner when the repository variable CI_MAC_RUNNER names it (its label, pi2-mini), for a pull request
    # opened by the repository's owner from a branch of this repository; GitHub's macos-26 for everything else: the
    # variable unset or empty, a push to main, a fork's pull request, anyone else's (docs/ci-runner.md, #990). The
    # author, since github.actor (whoever pushed) and github.triggering_actor (whoever ran it again) are the owner when
    # the owner pushes to, or re-runs, someone else's pull request; and github.actor too, so that someone else's push to
    # the owner's pull request stays off it (a re-run keeps the first run's actor). This is routing, not
    # a lock: a pull request runs its own copy of this file and can change it. The lock for outsiders is GitHub's setting
    # that has the owner approve their runs; for a collaborator who can push, there is none but trust.
    # The mini is for attempt 1 only. GitHub re-runs the original ref and SHA, using macos-26 for the same check.
    runs-on: "${{ github.run_attempt == '1' && vars.CI_MAC_RUNNER != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner && github.actor == github.repository_owner && vars.CI_MAC_RUNNER || 'macos-26' }}"
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
        with:
          # On the owner's runner the build folders stay, and the next step cleans the rest; GitHub's clean everything.
          clean: ${{ runner.environment != 'self-hosted' }}
      # Only on the owner's runner, which is not new at each job: what earlier jobs left (scripts/ci-runner-clean).
      - name: Clean the owner's runner
        if: runner.environment == 'self-hosted'
        working-directory: ${{ github.workspace }}
        run: scripts/ci-runner-clean start
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:macos
      - name: Clean the owner's runner after the job
        if: always() && runner.environment == 'self-hosted'
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: scripts/ci-runner-clean end

  engine-linux:
    name: Engine (Linux tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - run: npm run test:linux

  transcript:
    name: Transcript page (tests)
    # Plain Node with nothing macOS-specific, so it runs on Linux and leaves the scarcer macOS runners to the other jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Markdown, escaping, tool summaries, diffs, what a selection copies as and what Return does in an answer. No dependencies to install.
      - run: node --test test/
      - name: Check release-note extraction (no release)
        working-directory: app
        run: node --test test-release-notes.mjs

  scripts:
    name: Scripts (tests)
    # scripts/issue and its hook need only bash, git and jq, so they are checked on Linux (#235). Neither touches a
    # GitHub issue: the hook's test has a stand-in gh. So does the test of scripts/auto-merge, and it touches no pull
    # request (#553). scripts/test-docs-lists checks that the docs' lists of the engine's files keep up with them (#640).
    # scripts/test-iphone-sim checks scripts/iphone-sim with stand-ins for xcrun and xcodebuild: no simulator (#681).
    # scripts/test-ci-changes checks what the first job decides, in throwaway repositories, and that every path the
    # phone's project and links reach outside iphone/ is one its job runs for (#871).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/test-issue
      - run: scripts/test-issue-hook
      - run: scripts/test-auto-merge
      - run: scripts/test-docs-lists
      # scripts/check-protected-targets against package descriptions made in the test, one for each tampering (#674).
      - run: scripts/test-check-protected-targets
      - run: scripts/test-iphone-sim
      - run: scripts/test-ci-changes
      - run: node --test scripts/test-rerun-if-no-runner.mjs
      # What scripts/ci-runner-clean removes and keeps on the owner's runner, in a stand-in of it with stand-in tools (#990).
      - run: scripts/test-ci-runner-clean

  relay:
    name: Relay (tests)
    # The relay (relay/, #676): its type-check, its tests inside workerd, Cloudflare's Workers runtime, on the runner
    # with no account, and the check that its bundle's App Attest verifier is the engine's own file. Deploys nothing:
    # the two deployments are only built, as their deploys would build them (scripts/deploy.mjs --dry-run). This is the
    # one place the relay is tested on a pull request; relay.yml, which deploys, runs the same before each deploy (#677).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run check-bundle
      - run: npm run deploy -- development --dry-run
      - run: npm run deploy -- production --dry-run
      - run: npm run test-deploy

  relay-protocol:
    name: Relay (protocol test)
    # The protocol test (docs/iphone.md 10, #678): RemoteKit's relay client, through the system's WebSocket, against the
    # relay itself, run on the runner under Wrangler's local runtime on 127.0.0.1 (scripts/relay-protocol-test, through
    # relay/scripts/isolated.mjs: a throwaway home, no usage events, no Cloudflare credential). On macOS, since the client
    # is Swift on CryptoKit and Foundation's WebSocket. Runs whenever the macOS jobs run, and when the relay changed.
    # Deploys nothing.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.macos != 'false' || needs.changes.outputs.relay == 'true') }}
    concurrency:
      group: ci-relay-protocol-${{ github.ref }}
      cancel-in-progress: true
    # As the engine's job, by a second variable, CI_MAC_RUNNER_MORE (docs/ci-runner.md).
    runs-on: "${{ vars.CI_MAC_RUNNER_MORE != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner && github.actor == github.repository_owner && vars.CI_MAC_RUNNER_MORE || 'macos-26' }}"
    # Ten more than before pi² Remote's relay end ran here (#678), which builds the helper and waits out two minutes.
    timeout-minutes: 30
    steps:
      # Pinned by commit (v7), so that a moved tag cannot change what this job runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: ${{ runner.environment != 'self-hosted' }}
      - name: Clean the owner's runner
        if: runner.environment == 'self-hosted'
        run: scripts/ci-runner-clean start
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - name: Install the relay's packages
        working-directory: relay
        run: npm ci
      - name: Build the protocol test's program
        working-directory: app
        run: swift build --product pi2-relay-check
      - name: Run the client against the relay
        run: scripts/relay-protocol-test
      # The relay sees only sealed bytes (docs/iphone.md 10, #683): a marker session of RemoteKit's two ends through the
      # relay with a recorder at its edge, checked for every marker and secret in what the relay saw, kept and left in its
      # files, and against the allow-list of what it may see; then a marker planted in clear, which the check must find.
      - name: Check that the relay sees only sealed bytes
        if: ${{ !cancelled() }}
        run: scripts/relay-protocol-test --sealed
      # pi² Remote's relay end (#678): pi2-remote-helper-check --relay against the same relay, and through a real engine.
      - name: Install the engine's packages
        if: ${{ !cancelled() }}
        working-directory: engine
        run: npm ci
      - name: Build pi² Remote and its check
        if: ${{ !cancelled() }}
        working-directory: app
        run: swift build --product pi2-remote-helper && swift build --product pi2-remote-helper-check
      - name: Run pi² Remote's relay end against the relay
        if: ${{ !cancelled() }}
        run: scripts/relay-protocol-test --remote --engine engine/src/main.ts
      - name: Clean the owner's runner after the job
        if: always() && runner.environment == 'self-hosted'
        continue-on-error: true
        run: scripts/ci-runner-clean end

  app:
    name: App (build)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' }}
    concurrency:
      group: ci-app-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
      cancel-in-progress: true
    # As the engine's job, by CI_MAC_RUNNER on attempt 1 only (docs/ci-runner.md).
    runs-on: "${{ github.run_attempt == '1' && vars.CI_MAC_RUNNER != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner && github.actor == github.repository_owner && vars.CI_MAC_RUNNER || 'macos-26' }}"
    # Five more than before pi² Remote's check (#675), which runs an engine and waits out a session's resume window.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
      - name: Clean the owner's runner
        if: runner.environment == 'self-hosted'
        run: scripts/ci-runner-clean start
      # What scripts/test-copy refuses, in a stand-in checkout: it launches nothing. Here and not on Linux because both
      # it and its test read and write the bundle's Info.plist with PlistBuddy, which only macOS has (#235).
      - name: Check what scripts/test-copy refuses
        run: scripts/test-test-copy
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # app/Package.swift is not an owner's path, but it decides what the targets in the owner's folders are built from:
      # this fails if a protected target's path, files, dependencies, settings or plugins changed, if a package was
      # added, or if anything but RemoteKit's checks names @_spi(Vectors) (#674).
      - name: Check the owner's targets in Package.swift
        run: scripts/check-protected-targets
      - name: Build the app, ComputerKit and the probe
        working-directory: app
        run: swift build
      # Built with optimisation, as the app is released: closing a pane crashed only in an optimised build (#134).
      - name: Check the pane layout (optimised build)
        working-directory: app
        run: swift build -c release --product pi2-layout-check && .build/release/pi2-layout-check
      - name: Build and start the packaged release engine
        run: |
          ./app/build.sh release
          node app/check-release-build.mts "app/build/pi².app" --commit "$(git rev-parse HEAD)" --build-number "$(git rev-list --count HEAD)" --open-app
          node app/test-release-build.mts "app/build/pi².app"
      # What Return does in a message field (#174): the decision, then a real SwiftUI field in an off-screen window.
      - name: Check Return in the message field
        working-directory: app
        run: .build/debug/pi2-compose-check
      # How a window's size follows its content (#400): fixed smallest size, long lines, a stack of requests.
      - name: Check window sizes
        working-directory: app
        run: .build/debug/pi2-window-check
      - name: Check engine login item decisions
        working-directory: app
        run: .build/debug/pi2-login-item-check
      # Whether a connection is the app's, which alone may answer for the person (#504): real connections to a socket of
      # its own, from itself and from /usr/bin/nc, judged by their code signatures. Signs nothing, asks for nothing.
      - name: Check how the engine tells the app's connection
        working-directory: app
        run: .build/debug/pi2-peer-check
      # What a click on a link to a file in a conversation does (#451), in a temporary folder: shows nothing in Finder.
      - name: Check file links
        working-directory: app
        run: .build/debug/pi2-file-link-check
      # How the computer tool reaches SwiftUI controls by accessibility (#367, #453): stand-in views read in-process.
      - name: Check how computer use reaches controls
        working-directory: app
        run: .build/debug/pi2-computer-check
      # The conversation page loaded ahead for the next pane (#441): handed over clean, shows what it is sent, replaced
      # when its process ends, and moved into its pane without leaving the window. Off-screen windows of its own.
      - name: Check the conversation page loaded ahead
        working-directory: app
        run: .build/debug/pi2-transcript-check
      # What the client reads of a recorded session of the engine, compared with what it read before its models moved
      # into PiModels (#669). Reads two files in the checkout; touches nothing.
      - name: Check what the client reads of the engine
        working-directory: app
        run: .build/debug/pi2-client-check
      # RemoteKit, the channel to a phone and its sealed items (#674): Noise against the published vectors for IKpsk2 and
      # KK, HPKE against RFC 9180's, a pairing and a KK connection between two ends in memory, and what each reader
      # refuses. No key store, no network.
      - name: Check RemoteKit's channel and sealing
        working-directory: app
        run: .build/debug/pi2-remote-check
      # Every RemoteKit parser that reads bytes from the network, against mutated and random input: a fixed seed, a minute.
      - name: Fuzz RemoteKit's parsers
        working-directory: app
        run: .build/debug/pi2-remote-fuzz --seed 674 --seconds 60
      # pi² Remote (#675): its exits when the engine did not start it, a release build's Keychain and Secure Enclave logic
      # with stand-ins, the listener's ranges and limits, that a development build names no Keychain, Secure Enclave or
      # Bonjour call, then pairing and attaching over loopback with the check as its engine, and through a real engine on
      # a temporary data folder. No Keychain, no Bonjour, 127.0.0.1 alone; about two minutes, one the resume window.
      - name: Check pi² Remote
        working-directory: app
        run: |
          npm --prefix ../engine ci --no-audit --no-fund
          .build/debug/pi2-remote-helper-check --engine ../engine/src/main.ts
      # RemoteKit's relay client (#678): its messages, written and read, and the client against a relay the check plays
      # itself in memory, on a clock it moves. No network. The protocol test against the relay is its own job.
      - name: Check RemoteKit's relay client
        working-directory: app
        run: .build/debug/pi2-relay-check
      # RemoteKit is shared with the iPhone app, so it must keep building for iOS: CryptoKit only, nothing of the Mac's.
      - name: Build RemoteKit for iOS
        working-directory: app
        run: swift build --target RemoteKit --triple arm64-apple-ios18.0 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --scratch-path .build/ios
      - name: Clean the owner's runner after the job
        if: always() && runner.environment == 'self-hosted'
        continue-on-error: true
        run: scripts/ci-runner-clean end

  iphone:
    name: iPhone app (tests and Release build)
    # The iPhone app (iphone/, docs/iphone.md section 10, #681): its unit tests in a simulator, then a Release build.
    # Signs nothing and needs no secret. Runs when the change needs it, and when Which jobs the change needs fails;
    # skipped otherwise, and a skipped job reports its check as passed, so that this check can be a required one
    # without holding up a pull request that does not touch the phone (#871).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.iphone != 'false' }}
    # On main, one phone job at a time, each newer one waiting for the one before it rather than running beside it on
    # the scarce macOS runners (#936). None is cancelled: by default a group keeps one job waiting and cancels it for the
    # next, which would leave that merge with no finished phone job, so `queue: max` keeps every one waiting (up to 100).
    # GitHub refuses `queue: max` with `cancel-in-progress: true`; a pull request's older job is cancelled with its run
    # by the workflow's own group above.
    concurrency:
      group: ci-iphone-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    # The xcode-27 image (macOS 27) carries Xcode 27.0 to 27.2 and their iOS 27 simulators; macos-26 has only Xcode 26
    # and iOS 26. The project was made with Xcode 27.2 (LastUpgradeVersion 2720), and its deployment target is iOS 18.
    # Or the owner's runner, by CI_MAC_RUNNER_MORE, as the relay's protocol test (docs/ci-runner.md): it has Xcode 27.2
    # at the same path.
    runs-on: "${{ vars.CI_MAC_RUNNER_MORE != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner && github.actor == github.repository_owner && vars.CI_MAC_RUNNER_MORE || 'xcode-27' }}"
    timeout-minutes: 30
    env:
      # Named, not the image's default (27.1 when this was written), so that the image moving on changes nothing here.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: ${{ runner.environment != 'self-hosted' }}
      - name: Clean the owner's runner
        if: runner.environment == 'self-hosted'
        run: scripts/ci-runner-clean start
      - name: Xcode and its iOS simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes ios
      # A simulator of the job's own, made by the same script agents use (docs/development.md, Building the iPhone app):
      # unsigned builds, its derived data in iphone/build.
      - name: Make a simulator
        run: scripts/iphone-sim create ci --type "iPhone 18 Pro" --runtime com.apple.CoreSimulator.SimRuntime.iOS-27-2
      - name: Unit tests
        run: scripts/iphone-sim test ci
      # What has none of the #if DEBUG code, as TestFlight's builds will be (unsigned here).
      - name: Release build
        run: scripts/iphone-sim build ci --release
      - name: Clean the owner's runner after the job
        if: always() && runner.environment == 'self-hosted'
        continue-on-error: true
        run: scripts/ci-runner-clean end
