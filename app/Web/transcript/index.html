<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  The transcript shows untrusted text and must never reach the network: only this folder's own scripts and stylesheet
  load, pictures come from the app as blobs, and nothing can be fetched, framed, submitted or based elsewhere.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src blob:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>Transcript</title>
<link rel="stylesheet" href="transcript.css">
<script defer src="markdown.js"></script>
<script defer src="tools.js"></script>
<script defer src="clipboard.js"></script>
<script defer src="transcript.js"></script>
</head>
<body>
<main id="transcript" aria-label="Conversation"></main>
<button id="jump" type="button" hidden data-nocopy>Jump to latest</button>
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Picture" hidden data-nocopy>
  <img alt="">
  <button type="button" aria-label="Close">Close</button>
</div>
</body>
</html>
